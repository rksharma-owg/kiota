name: idempotency-tests
concurrency:
  group: ci-idempotency-tests-${{ github.ref }}-${{ inputs.contributionSha }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ inputs.contributionSha }}
        fetch-depth: 0
        persist-credentials: false
    - name: Verify exact contribution and target commit
      shell: bash
      run: 'test "$(git rev-parse HEAD)" = "${{ inputs.contributionSha }}"

        git merge-base --is-ancestor ${{ inputs.targetSha }} HEAD

        git rev-parse HEAD

        '
    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
      with:
        global-json-file: global.json
    - name: Restore dependencies
      run: dotnet restore kiota.slnx
    - name: Build
      run: dotnet publish ./src/kiota/kiota.csproj -c Release -p:PublishSingleFile=true -p:PublishReadyToRun=true -o ./publish -f net10.0
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: generator
        path: publish
    if: ${{ !inputs.baselineOnly }}
  download-openapi-specs:
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        description:
        - oas::petstore
        - https://api.twitter.com/2/openapi.json
        - https://developers.notion.com/openapi.json
        - https://raw.githubusercontent.com/stripe/openapi/refs/heads/master/latest/openapi.spec3.json
        - https://raw.githubusercontent.com/googlemaps/openapi-specification/refs/tags/v1.22.5/dist/google-maps-platform-openapi3.yml
        - https://raw.githubusercontent.com/meraki/openapi/refs/heads/master/openapi/spec3.json
        - https://developers.pipedrive.com/docs/api/v1/openapi.yaml
        - https://raw.githubusercontent.com/twilio/twilio-oai/refs/heads/main/spec/yaml/twilio_api_v2010.yaml
        - https://raw.githubusercontent.com/docusign/OpenAPI-Specifications/refs/heads/master/esignature.rest.swagger-v2.1.json
        - https://raw.githubusercontent.com/github/rest-api-description/refs/heads/main/descriptions/api.github.com/api.github.com.json
        - apisguru::apis.guru
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ inputs.contributionSha }}
        fetch-depth: 0
        persist-credentials: false
    - name: Verify exact contribution and target commit
      shell: bash
      run: 'test "$(git rev-parse HEAD)" = "${{ inputs.contributionSha }}"

        git merge-base --is-ancestor ${{ inputs.targetSha }} HEAD

        git rev-parse HEAD

        '
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: generator
        path: publish
    - run: chmod a+x ./publish/kiota
    - name: Download OpenAPI specs
      run: ./it/download-openapi-specs.ps1 -descriptionUrl ${{ matrix.description }}
      shell: pwsh
    - id: replace_url
      run: ./it/get-description-artifact-key.ps1 -descriptionUrl ${{ matrix.description }}
      shell: pwsh
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: description-${{ steps.replace_url.outputs.ARTKEY }}
        path: 'it/openapi.yaml

          it/openapi.json

          '
    if: ${{ !inputs.baselineOnly }}
  idempotency:
    runs-on: ubuntu-latest
    needs: download-openapi-specs
    strategy:
      fail-fast: false
      matrix:
        language:
        - java
        - csharp
        - go
        - typescript
        - ruby
        - php
        - python
        - dart
        description:
        - ./tests/Kiota.Builder.IntegrationTests/InheritingErrors.yaml
        - ./tests/Kiota.Builder.IntegrationTests/InheritingThreeLevels.yaml
        - ./tests/Kiota.Builder.IntegrationTests/NoUnderscoresInModel.yaml
        - oas::petstore
        - https://api.twitter.com/2/openapi.json
        - https://developers.notion.com/openapi.json
        - https://raw.githubusercontent.com/stripe/openapi/refs/heads/master/latest/openapi.spec3.json
        - https://raw.githubusercontent.com/googlemaps/openapi-specification/refs/tags/v1.22.5/dist/google-maps-platform-openapi3.yml
        - https://raw.githubusercontent.com/meraki/openapi/refs/heads/master/openapi/spec3.json
        - https://developers.pipedrive.com/docs/api/v1/openapi.yaml
        - https://raw.githubusercontent.com/twilio/twilio-oai/refs/heads/main/spec/yaml/twilio_api_v2010.yaml
        - https://raw.githubusercontent.com/docusign/OpenAPI-Specifications/refs/heads/master/esignature.rest.swagger-v2.1.json
        - https://raw.githubusercontent.com/github/rest-api-description/refs/heads/main/descriptions/api.github.com/api.github.com.json
        - apisguru::apis.guru
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ inputs.contributionSha }}
        fetch-depth: 0
        persist-credentials: false
    - name: Verify exact contribution and target commit
      shell: bash
      run: 'test "$(git rev-parse HEAD)" = "${{ inputs.contributionSha }}"

        git merge-base --is-ancestor ${{ inputs.targetSha }} HEAD

        git rev-parse HEAD

        '
    - id: replace_url
      run: ./it/get-description-artifact-key.ps1 -descriptionUrl ${{ matrix.description }}
      shell: pwsh
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      if: startsWith(matrix.description, './') != true
      with:
        name: description-${{ steps.replace_url.outputs.ARTKEY }}
        path: description
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: generator
        path: publish
    - run: chmod a+x ./publish/kiota
    - name: Check if test is suppressed
      id: check-suppressed
      run: '$isSuppressed = . ./it/get-is-suppressed.ps1 -descriptionUrl ${{ matrix.description }} -language ${{ matrix.language }} -kind idempotency

        Write-Output "IS_SUPPRESSED=$($isSuppressed.ToString().ToLowerInvariant())" >> $Env:GITHUB_OUTPUT

        '
      shell: pwsh
    - name: Verify idempotency
      shell: pwsh
      run: ./it/compare-generation.ps1 -descriptionUrl "${{ steps.replace_url.outputs.DESCRIPTION_PATH }}" -descriptionKey ${{ matrix.description }}  -language
        "${{ matrix.language }}"
      continue-on-error: ${{ steps.check-suppressed.outputs.IS_SUPPRESSED == 'true' }}
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: always()
      with:
        name: idempotency-${{ matrix.language }}-${{ steps.replace_url.outputs.ARTKEY }}
        path: idempotency-results/*.zip
    if: ${{ !inputs.baselineOnly }}
  cleanup:
    runs-on: ubuntu-latest
    needs: idempotency
    steps:
    - uses: jimschubert/delete-artifacts-action@f5cb1978980f2e189a2b3484d430f8810860ba38
      with:
        artifact_name: generator
        min_bytes: '0'
    if: ${{ !inputs.baselineOnly }}
  check-idempotency-tests:
    runs-on: ubuntu-latest
    needs: idempotency
    if: ${{ !inputs.baselineOnly && (always()) }}
    steps:
    - name: All build matrix options are successful
      if: ${{ !(contains(needs.*.result, 'failure')) }}
      run: exit 0
    - name: One or more build matrix options failed
      if: ${{ contains(needs.*.result, 'failure') }}
      run: exit 1
  baseline-build:
    if: ${{ inputs.baselineOnly }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - &id001
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ inputs.targetSha }}
        persist-credentials: false
    - &id002
      name: Verify untouched target SHA
      shell: bash
      env:
        BASE_SHA: ${{ inputs.targetSha }}
      run: 'set -euo pipefail

        [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]

        test "$(git rev-parse HEAD)" = "$BASE_SHA"

        git rev-parse HEAD'
    - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
      with:
        global-json-file: global.json
    - name: Publish untouched baseline
      run: dotnet publish ./src/kiota/kiota.csproj -c Release -p:PublishSingleFile=true -p:PublishReadyToRun=true -o ./publish -f net10.0
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: baseline-generator
        path: publish
  baseline-suppression-probe:
    if: ${{ inputs.baselineOnly }}
    needs: baseline-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
        - language: java
          description: https://api.twitter.com/2/openapi.json
        - language: csharp
          description: https://api.twitter.com/2/openapi.json
        - language: go
          description: https://api.twitter.com/2/openapi.json
        - language: typescript
          description: https://api.twitter.com/2/openapi.json
        - language: ruby
          description: https://api.twitter.com/2/openapi.json
        - language: php
          description: https://api.twitter.com/2/openapi.json
        - language: python
          description: https://api.twitter.com/2/openapi.json
        - language: dart
          description: https://api.twitter.com/2/openapi.json
        - language: java
          description: https://raw.githubusercontent.com/stripe/openapi/refs/heads/master/latest/openapi.spec3.json
        - language: typescript
          description: https://developers.notion.com/openapi.json
    steps:
    - *id001
    - *id002
    - id: key
      shell: pwsh
      env:
        DESCRIPTION: ${{ matrix.description }}
      run: ./it/get-description-artifact-key.ps1 -descriptionUrl $Env:DESCRIPTION
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: description-${{ steps.key.outputs.ARTKEY }}
        path: description
        run-id: ${{ inputs.fixtureRun }}
        github-token: ${{ github.token }}
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: baseline-generator
        path: publish
    - name: Make baseline executable
      run: chmod a+x publish/kiota
    - name: Run original idempotency command without suppression
      shell: pwsh
      env:
        DESCRIPTION: ${{ matrix.description }}
        LANGUAGE: ${{ matrix.language }}
        DESCRIPTION_PATH: ${{ steps.key.outputs.DESCRIPTION_PATH }}
      run: ./it/compare-generation.ps1 -descriptionUrl $Env:DESCRIPTION_PATH -descriptionKey $Env:DESCRIPTION -language $Env:LANGUAGE
    - if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: baseline-idempotency-${{ matrix.language }}-${{ steps.key.outputs.ARTKEY }}
        path: idempotency-results/*.zip
'on':
  workflow_dispatch:
    inputs:
      contributionSha:
        description: Exact contribution commit
        required: true
        type: string
      targetSha:
        description: Current upstream main
        required: true
        type: string
      prNumber:
        description: Contribution PR
        required: true
        type: string
      baselineOnly:
        type: boolean
        default: false
      fixtureRun:
        type: string
        required: false
run-name: ${{ inputs.baselineOnly && 'Baseline suppression probes' || format('PR {0} conflict validation - idempotency-tests', inputs.prNumber) }}
