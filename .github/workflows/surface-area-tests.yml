name: surface-area-tests
concurrency:
  group: ci-surface-area-tests-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  pull-requests: write
  issues: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: 20897ef426b8d9713b1bdc8fbe95ec0f23e18643
        fetch-depth: 0
        persist-credentials: false
    - name: Verify exact contribution and target commit
      shell: bash
      run: 'test "$(git rev-parse HEAD)" = "20897ef426b8d9713b1bdc8fbe95ec0f23e18643"

        git merge-base --is-ancestor 9af1cce7e4475dff80bb8d7f48859e9dedbbccef HEAD

        git rev-parse HEAD

        '
    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
      with:
        global-json-file: global.json
    - name: Restore dependencies
      run: dotnet restore kiota.slnx
    - name: Build
      run: dotnet publish ./src/kiota/kiota.csproj -c Release -p:PublishSingleFile=true -p:PublishReadyToRun=true -o ./publish
        -f net10.0
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: generator
        path: publish
  surface-diff:
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        language:
        - csharp
        - java
        description:
        - https://github.com/microsoftgraph/msgraph-metadata/raw/refs/heads/master/openapi/beta/openapi.yaml
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: 20897ef426b8d9713b1bdc8fbe95ec0f23e18643
        fetch-depth: 0
        persist-credentials: false
    - name: Verify exact contribution and target commit
      shell: bash
      run: 'test "$(git rev-parse HEAD)" = "20897ef426b8d9713b1bdc8fbe95ec0f23e18643"

        git merge-base --is-ancestor 9af1cce7e4475dff80bb8d7f48859e9dedbbccef HEAD

        git rev-parse HEAD

        '
    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
      with:
        global-json-file: global.json
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: generator
        path: publish
    - run: chmod a+x ./publish/kiota
    - name: Generate baseline & current DOM exports and diff
      id: compare
      shell: pwsh
      timeout-minutes: 30
      run: "$additionalArguments = ./it/get-additional-arguments.ps1 `\n  -descriptionKey \"${{ matrix.description }}\" `\n\
        \  -language \"${{ matrix.language }}\" `\n  -includeOutputParameter $false\n$patchFileName = \"${{ matrix.language\
        \ }}-dom-export.patch\"\n$patchPath = Join-Path -Path (Get-Location) -ChildPath $patchFileName\n./it/compare-dom-export.ps1\
        \ `\n  -descriptionUrl \"${{ matrix.description }}\" `\n  -language \"${{ matrix.language }}\" `\n  -patchPath $patchPath\
        \ `\n  -baselineVersion \"${{ github.event.inputs.baselineVersion }}\" `\n  -additionalArguments $additionalArguments\n\
        $hasPatch = (Test-Path $patchPath) -and ((Get-Item $patchPath).Length -gt 0)\n# The diff tool runs as a Docker container\
        \ action with the repository mounted at\n# /github/workspace, so it must receive a workspace-relative path. Passing\
        \ the\n# absolute host path fails inside the container with a DirectoryNotFoundException.\nWrite-Output \"patchFilePath=$patchFileName\"\
        \ >> $Env:GITHUB_OUTPUT\nWrite-Output \"hasPatch=$($hasPatch.ToString().ToLowerInvariant())\" >> $Env:GITHUB_OUTPUT\n"
    - name: Analyze DOM export diff for breaking changes
      id: diff
      if: ${{ steps.compare.outputs.hasPatch == 'true' }}
      uses: microsoftgraph/kiota-dom-export-diff-tool/tool@e32a993776c40f03dce8c55ff7a607ed21011945
      with:
        path: ${{ steps.compare.outputs.patchFilePath }}
        fail-on-removal: true
    - name: Upload patch file as artifact
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      continue-on-error: true
      with:
        name: surface-area-patch-${{ matrix.language }}
        path: '*.patch'
    - name: Upload explanations file as artifact
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      continue-on-error: true
      with:
        name: surface-area-explanations-${{ matrix.language }}
        path: explanations.txt
  comment-on-pull-request:
    runs-on: ubuntu-latest
    needs: surface-diff
    if: ${{ always() && github.event_name == 'pull_request' }}
    strategy:
      fail-fast: false
      matrix:
        language:
        - csharp
        - java
    steps:
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      continue-on-error: true
      with:
        name: surface-area-explanations-${{ matrix.language }}
        path: surface-area-explanations-${{ matrix.language }}
    - name: Comment on the pull request
      if: ${{ hashFiles(format('surface-area-explanations-{0}/explanations.txt', matrix.language)) != '' }}
      continue-on-error: true
      uses: microsoftgraph/kiota-dom-export-diff-tool/comment@e32a993776c40f03dce8c55ff7a607ed21011945
      with:
        comment: surface-area-explanations-${{ matrix.language }}/explanations.txt
        prNumber: ${{ github.event.pull_request.number }}
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  cleanup:
    runs-on: ubuntu-latest
    needs: surface-diff
    if: always()
    steps:
    - uses: jimschubert/delete-artifacts-action@f5cb1978980f2e189a2b3484d430f8810860ba38
      with:
        artifact_name: generator
        min_bytes: '0'
  check-surface-area-tests:
    runs-on: ubuntu-latest
    needs: surface-diff
    if: always()
    steps:
    - name: All build matrix options are successful
      if: ${{ !(contains(needs.*.result, 'failure')) }}
      run: exit 0
    - name: One or more build matrix options failed
      if: ${{ contains(needs.*.result, 'failure') }}
      run: exit 1
'on':
  workflow_dispatch:
    inputs:
      baselineVersion:
        required: false
        default: ''
        type: string
