name: CodeQL
permissions:
  contents: read
  actions: read
  security-events: write
jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language:
        - csharp
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: 20897ef426b8d9713b1bdc8fbe95ec0f23e18643
        fetch-depth: 0
        persist-credentials: false
    - name: Verify exact contribution and target commit
      shell: bash
      run: 'test "$(git rev-parse HEAD)" = "20897ef426b8d9713b1bdc8fbe95ec0f23e18643"

        git merge-base --is-ancestor 9af1cce7e4475dff80bb8d7f48859e9dedbbccef HEAD

        git rev-parse HEAD

        '
    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
      with:
        global-json-file: global.json
    - name: Initialize CodeQL
      uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2
      with:
        languages: ${{ matrix.language }}
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore -c Release
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2
'on':
  workflow_dispatch: null
