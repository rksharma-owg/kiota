name: .NET
jobs:
  dotnet-build:
    if: ${{ !inputs.coverageOnly && !inputs.coverageCommandOnly }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      code-quality: write
      pull-requests: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ inputs.contributionSha }}
        fetch-depth: 0
        persist-credentials: false
    - name: Verify exact contribution and target commit
      shell: bash
      run: 'test "$(git rev-parse HEAD)" = "${{ inputs.contributionSha }}"

        git merge-base --is-ancestor ${{ inputs.targetSha }} HEAD

        git rev-parse HEAD

        '
    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
      with:
        global-json-file: global.json
    - name: Setup Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        go-version: stable
    - name: Restore dependencies
      run: dotnet restore kiota.slnx
    - name: Check formatting
      run: dotnet format --verify-no-changes
    - name: Build
      run: dotnet build kiota.slnx --no-restore
    - name: Test
      run: dotnet test kiota.slnx --no-build --verbosity normal --results-directory=./TestResults --coverlet --coverlet-output-format cobertura --report-gh
    - name: Install report generator
      run: dotnet tool install --global dotnet-reportgenerator-globaltool
    - name: Generate coverage report
      run: reportgenerator -reports:./TestResults/**/coverage.cobertura.*.xml -targetdir:./reports/coverage -reporttypes:"Html;MarkdownSummaryGithub;Cobertura"
    - name: Add coverage to job summary
      run: cat ./reports/coverage/SummaryGithub.md >> $GITHUB_STEP_SUMMARY
    - name: Upload coverage report
      uses: actions/upload-code-coverage@2b21a77928be8d5168c2b9581a67f2adbebacc52
      if: github.event_name != 'merge_group' && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor
        != 'dependabot[bot]') || (github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch))
      with:
        file: ./reports/coverage/Cobertura.xml
        language: CSharp
        label: code-coverage/dotnet
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: coverage
        path: reports/coverage
  test-release:
    if: ${{ !inputs.coverageOnly && !inputs.coverageCommandOnly }}
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-latest
        - macos-latest
        - windows-latest
        - windows-11-arm
        - ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ inputs.contributionSha }}
        fetch-depth: 0
        persist-credentials: false
    - name: Verify exact contribution and target commit
      shell: bash
      run: 'test "$(git rev-parse HEAD)" = "${{ inputs.contributionSha }}"

        git merge-base --is-ancestor ${{ inputs.targetSha }} HEAD

        git rev-parse HEAD

        '
    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
      with:
        global-json-file: global.json
    - name: Restore dependencies
      run: dotnet restore kiota.slnx
    - name: Publish ${{ matrix.os }}
      run: dotnet publish ./src/kiota/kiota.csproj -c Release -p:PublishSingleFile=true -o ./${{ matrix.os }} -f net10.0
    - name: Upload artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: ${{ matrix.os }}
        path: ./${{ matrix.os }}
    - name: Isolate the binary
      if: runner.os != 'Windows'
      run: 'mkdir ./${{ matrix.os }}-standalone

        cp ./${{ matrix.os }}/kiota ./${{ matrix.os }}-standalone/kiota

        '
    - name: Check the built in default settings
      if: runner.os != 'Windows'
      run: "INFO_RESULT=$(./${{ matrix.os }}-standalone/kiota info -l Java)\nif [[ $INFO_RESULT == *\"maturity level\"* ]]; then\n  echo \"Built in defaults are working\"\
        \nelse\n  echo \"Built in defaults NOT working\"\n  ./${{ matrix.os }}/kiota info -l Java\n  exit 1\nfi\n"
    - name: Isolate the binary
      if: runner.os == 'Windows'
      run: 'mkdir ./${{ matrix.os }}-standalone

        cp ./${{ matrix.os }}/kiota.exe ./${{ matrix.os }}-standalone/kiota.exe

        '
    - name: Check the built in default settings
      if: runner.os == 'Windows'
      shell: bash
      run: "INFO_RESULT=$(./${{ matrix.os }}-standalone/kiota.exe info -l Java)\nif [[ $INFO_RESULT == *\"maturity level\"* ]]; then\n  echo \"Built in defaults are\
        \ working\"\nelse\n  echo \"Built in defaults NOT working\"\n  ./${{ matrix.os }}/kiota info -l Java\n  exit 1\nfi\n"
  dart-import-regression:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ inputs.contributionSha }}
        persist-credentials: false
    - name: Verify contribution SHA
      run: test "$(git rev-parse HEAD)" = "${{ inputs.contributionSha }}"
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.sha }}
        path: harness
        persist-credentials: false
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ inputs.targetSha }}
        path: baseline
        persist-credentials: false
    - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
      with:
        global-json-file: global.json
    - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d
      with:
        sdk: stable
    - name: Generate baseline and patch clients
      shell: bash
      run: "set -euo pipefail\ntest \"$(git -C harness rev-parse HEAD)\" = \"$GITHUB_SHA\"\ntest \"$(git -C baseline rev-parse HEAD)\" = \"${{ inputs.targetSha }}\"\
        \ndotnet build src/kiota/kiota.csproj -f net10.0\ndotnet build baseline/src/kiota/kiota.csproj -f net10.0\nfor output in baseline-client patch-client; do\n\
        \  mkdir -p \"$output/lib\"\n  cp it/dart/pubspec.yaml it/dart/analysis_options.yaml \"$output/\"\ndone\ndotnet baseline/src/kiota/bin/Debug/net10.0/kiota.dll\
        \ generate -l Dart -d harness/.preflight/dart-inline-items.json -o baseline-client/lib --co --ebc\ndotnet src/kiota/bin/Debug/net10.0/kiota.dll generate -l\
        \ Dart -d harness/.preflight/dart-inline-items.json -o patch-client/lib --co --ebc\n"
    - name: Verify baseline compiler failure and patch compiler success
      shell: bash
      run: "set -euo pipefail\ndart --version\ncd baseline-client\ndart pub get\nif dart analyze lib/ > ../baseline-analyze.log 2>&1; then\n  cat ../baseline-analyze.log\n\
        \  echo 'Expected the baseline missing import to fail analysis'\n  exit 1\nfi\ncat ../baseline-analyze.log\ngrep -F 'uri_does_not_exist' ../baseline-analyze.log\n\
        cd ../patch-client\ncp ../baseline-client/pubspec.lock .\ndart pub get --enforce-lockfile\ndart analyze lib/\ncd ..\ndiff -ru baseline-client/lib patch-client/lib\
        \ > source.diff || test \"$?\" = 1\ncat source.diff\n"
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: dart-regression-evidence
        path: 'baseline-analyze.log

          source.diff

          patch-client/pubspec.lock

          '
    if: ${{ !inputs.coverageOnly && !inputs.coverageCommandOnly && (inputs.prNumber == '8346') }}
  model-factory-regression:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-latest
        - windows-latest
        - macos-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ inputs.contributionSha }}
        persist-credentials: false
    - name: Verify contribution SHA
      shell: bash
      run: test "$(git rev-parse HEAD)" = "${{ inputs.contributionSha }}"
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.sha }}
        path: harness
        persist-credentials: false
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ inputs.targetSha }}
        path: baseline
        persist-credentials: false
    - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
      with:
        global-json-file: global.json
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        go-version: stable
    - name: Prove baseline regression and patch success
      shell: bash
      run: "set -euo pipefail\ntest \"$(git -C harness rev-parse HEAD)\" = \"$GITHUB_SHA\"\ntest \"$(git -C baseline rev-parse HEAD)\" = \"${{ inputs.targetSha }}\"\
        \ncp tests/Kiota.Builder.Tests/KiotaBuilderTests.ModelFactory.cs baseline/tests/Kiota.Builder.Tests/\nif dotnet test baseline/tests/Kiota.Builder.Tests/Kiota.Builder.Tests.csproj\
        \ -- --filter-method '*CreatesBackwardCompatibleFactoryWhileSharedModelPropertiesAreBuildingAsync*' > baseline-regression.log 2>&1; then\n  cat baseline-regression.log\n\
        \  echo 'Expected missing factory regression to fail'\n  exit 1\nfi\ncat baseline-regression.log\ngrep -F 'Sequence contains no matching element' baseline-regression.log\n\
        grep -E 'failed: +2' baseline-regression.log\ndotnet test tests/Kiota.Builder.Tests/Kiota.Builder.Tests.csproj -- --filter-method '*CreatesBackwardCompatibleFactoryWhileSharedModelPropertiesAreBuildingAsync*'\n"
    - name: Generate shared response stress fixtures
      shell: bash
      run: "set -euo pipefail\ndotnet build src/kiota/kiota.csproj -f net10.0\nfor language in CSharp Go; do\n  for attempt in 1 2 3 4 5; do\n    dotnet src/kiota/bin/Debug/net10.0/kiota.dll\
        \ generate -l \"$language\" -d harness/.preflight/csharp-race-stress.json -o \"stress-$language\" --co\n  done\ndone\n"
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: race-regression-${{ matrix.os }}
        path: baseline-regression.log
    if: ${{ !inputs.coverageOnly && !inputs.coverageCommandOnly && (inputs.prNumber == '8347') }}
  vscode-test_and_generate_binaries:
    if: ${{ !inputs.coverageOnly && !inputs.coverageCommandOnly }}
    strategy:
      fail-fast: false
      matrix:
        binaries:
        - architecture: win-x64
          os: windows-latest
        - architecture: win-arm64
          os: windows-11-arm
        - architecture: linux-x64
          os: ubuntu-latest
        - architecture: linux-arm64
          os: ubuntu-24.04-arm
        - architecture: osx-arm64
          os: macOS-latest
    runs-on: ${{ matrix.binaries.os }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ inputs.contributionSha }}
        fetch-depth: 0
        persist-credentials: false
    - name: Verify exact contribution and target commit
      shell: bash
      run: 'test "$(git rev-parse HEAD)" = "${{ inputs.contributionSha }}"

        git merge-base --is-ancestor ${{ inputs.targetSha }} HEAD

        git rev-parse HEAD

        '
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version: 24.x
    - name: Use .NET SDK from global.json
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
      with:
        global-json-file: global.json
    - id: last_release
      run: '$releaseVersion = gh release list --repo microsoft/kiota --exclude-drafts --exclude-pre-releases --json tagName,isLatest | ConvertFrom-Json | ? {$_.isLatest
        -eq $true} | select -first 1 -ExpandProperty tagName

        $releaseVersion = "$releaseVersion" -replace ''^v'', ''''

        Write-Output "RELEASE_VERSION=$releaseVersion" >> $Env:GITHUB_OUTPUT

        '
      shell: pwsh
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - run: scripts/update-vscode-releases.ps1 -version "v${{ steps.last_release.outputs.RELEASE_VERSION }}" -packageJsonFilePath "./vscode/packages/microsoft-kiota/package.json"
        -runtimeFilePath "./vscode/packages/npm-package/lib/runtime.json" -online
      shell: pwsh
    - name: Install dependencies
      run: npm ci
      working-directory: vscode
    - name: Publish kiota for testing - ${{ matrix.binaries.os }} - ${{ matrix.binaries.architecture }}
      run: 'dotnet publish src/kiota/kiota.csproj -c Release --runtime ${{ matrix.binaries.architecture }} -p:PublishSingleFile=true --self-contained --output vscode/packages/npm-package/.kiotabin/${{
        steps.last_release.outputs.RELEASE_VERSION }}/${{ matrix.binaries.architecture }} -f net10.0

        '
      shell: pwsh
    - name: Lint
      run: npm run lint
      working-directory: vscode
    - name: Run tests - package
      shell: bash
      working-directory: vscode
      run: |
        set -euo pipefail
        runtime="${{ steps.last_release.outputs.RELEASE_VERSION }}"
        arch="${{ matrix.binaries.architecture }}"
        mkdir -p "packages/npm-package/lib/.kiotabin/$runtime/$arch"
        cp -R "packages/npm-package/.kiotabin/$runtime/$arch/." "packages/npm-package/lib/.kiotabin/$runtime/$arch/"
        if [[ "${{ runner.os }}" == "Linux" ]]; then
          xvfb-run -a npm run test:package:coverage
        else
          npm run test:package:coverage
        fi
    - name: Run tests - vscode
      shell: bash
      working-directory: vscode
      run: |
        set -euo pipefail
        npm run build
        npm run pretest --workspace=kiota
        node - <<'JS'
        const fs = require('fs');
        const config = `import original from './.vscode-test.mjs';
        import os from 'node:os';
        import path from 'node:path';
        export default {...original, tests: original.tests.map(test => ({...test, launchArgs: ['--user-data-dir=' + path.join(os.tmpdir(), 'kiota-preflight-user'), '--extensions-dir=' + path.join(os.tmpdir(), 'kiota-preflight-ext')]}))};`;
        fs.writeFileSync('packages/microsoft-kiota/.vscode-test.preflight.mjs', config);
        JS
        if [[ "${{ runner.os }}" == "Linux" ]]; then
          xvfb-run -a npx vscode-test --config packages/microsoft-kiota/.vscode-test.preflight.mjs --coverage | tee vscode-tests.log
        else
          npx vscode-test --config packages/microsoft-kiota/.vscode-test.preflight.mjs --coverage | tee vscode-tests.log
        fi
        grep -E '[1-9][0-9]* passing' vscode-tests.log
    - name: Upload artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: ${{ matrix.binaries.architecture }}
        path: vscode/packages/npm-package/.kiotabin/${{ steps.last_release.outputs.RELEASE_VERSION }}/${{ matrix.binaries.architecture }}
        retention-days: 3
  vscode-build:
    if: ${{ !inputs.coverageOnly && !inputs.coverageCommandOnly }}
    needs:
    - vscode-test_and_generate_binaries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        builds:
        - name: VS Code Extension
          path: microsoft-kiota
          id: vscode
          item: vsix
        - name: Npm Package
          path: npm-package
          id: package
          item: tgz
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ inputs.contributionSha }}
        fetch-depth: 0
        persist-credentials: false
    - name: Verify exact contribution and target commit
      shell: bash
      run: 'test "$(git rev-parse HEAD)" = "${{ inputs.contributionSha }}"

        git merge-base --is-ancestor ${{ inputs.targetSha }} HEAD

        git rev-parse HEAD

        '
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version: 24.x
    - id: last_release
      run: '$releaseVersion = gh release list --repo microsoft/kiota --exclude-drafts --exclude-pre-releases --json tagName,isLatest | ConvertFrom-Json | ? {$_.isLatest
        -eq $true} | select -first 1 -ExpandProperty tagName

        Write-Output "RELEASE_VERSION=$releaseVersion" >> $Env:GITHUB_OUTPUT

        '
      shell: pwsh
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - run: scripts/update-vscode-releases.ps1 -version "${{ steps.last_release.outputs.RELEASE_VERSION }}" -packageJsonFilePath "./vscode/packages/microsoft-kiota/package.json"
        -runtimeFilePath "./vscode/packages/npm-package/lib/runtime.json" -online
      shell: pwsh
    - name: Install dependencies
      run: npm ci
      working-directory: vscode
    - run: npm run package:${{ matrix.builds.id }}
      if: matrix.builds.id == 'package'
      name: Package - ${{ matrix.builds.id }}
      working-directory: vscode
    - run: 'npm i

        npm run build

        '
      working-directory: vscode/packages/
      name: Package - ${{ matrix.builds.id }}
      if: matrix.builds.id == 'vscode'
    - run: 'npm i -g @vscode/vsce

        vsce package

        '
      working-directory: vscode/packages/${{ matrix.builds.path }}
      name: Package - ${{ matrix.builds.id }}
      if: matrix.builds.id == 'vscode'
    - name: Upload artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: ${{ matrix.builds.name }}
        path: vscode/packages/${{ matrix.builds.path }}/*.${{ matrix.builds.item }}
  vscode-build_extension:
    runs-on: ubuntu-latest
    needs:
    - vscode-build
    if: ${{ !inputs.coverageOnly && !inputs.coverageCommandOnly && (always()) }}
    steps:
    - name: All build matrix options are successful
      if: ${{ !(contains(needs.*.result, 'failure')) }}
      run: exit 0
    - name: One or more build matrix options failed
      if: ${{ contains(needs.*.result, 'failure') }}
      run: exit 1
  generated-php:
    if: ${{ !inputs.coverageOnly && !inputs.coverageCommandOnly }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: harness
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.contributionSha }}
          fetch-depth: 0
          path: contribution
          persist-credentials: false
      - name: Verify exact contribution and target
        working-directory: contribution
        run: |
          test "$(git rev-parse HEAD)" = "${{ inputs.contributionSha }}"
          git merge-base --is-ancestor ${{ inputs.targetSha }} HEAD
          git rev-parse HEAD
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: contribution/global.json
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.2'
          coverage: none
      - name: Build generator
        working-directory: contribution
        run: dotnet build src/kiota/kiota.csproj -c Release -f net10.0
      - name: Generate PHP with deprecated elements
        working-directory: contribution
        run: dotnet src/kiota/bin/Release/net10.0/kiota.dll generate -l PHP -d ../harness/.github/kiota-preflight/php-deprecation.json -o generated --co --ebc
      - name: Validate generated PHP syntax and metadata
        working-directory: contribution
        run: |
          php --version
          find generated -name '*.php' -print0 | xargs -0 -n 1 php -l
          python3 - <<'PY'
          from pathlib import Path
          import re
          def documented(path, declaration):
              text = Path(path).read_text()
              assert re.search(r'/\*\*[^*]*(?:\*(?!/)[^*]*)*@deprecated[^*]*(?:\*(?!/)[^*]*)*\*/\s*' + declaration, text), (path, declaration)
          documented('generated/Models/Legacy.php', r'class Legacy\b')
          documented('generated/Models/LegacyStatus.php', r'class LegacyStatus\b')
          documented('generated/Models/Legacy.php', r'public function getName\(')
          documented('generated/Models/Legacy.php', r'public function setName\(')
          documented('generated/Legacy/LegacyRequestBuilder.php', r'public function get\(')
          documented('generated/Legacy/LegacyRequestBuilder.php', r'public function toGetRequestInformation\(')
          print('Generated model, enum, accessors and operation expose PHPDoc deprecation metadata.')
          PY
  explicit-coverage:
    if: ${{ inputs.coverageOnly }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: contribution
            sha: ${{ inputs.contributionSha }}
          - kind: baseline
            sha: ${{ inputs.targetSha }}
          - kind: merge
            sha: ${{ inputs.mergeSha }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ matrix.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify tested commit
        run: |
          test "$(git rev-parse HEAD)" = "${{ matrix.sha }}"
          git rev-parse HEAD
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: stable
      - name: Restore and build unchanged source
        run: |
          dotnet restore kiota.slnx
          dotnet build kiota.slnx --no-restore
      - name: Run full suite with explicit production assembly coverage
        run: dotnet test kiota.slnx --no-build --verbosity normal --results-directory=./TestResults --coverlet --coverlet-output-format cobertura --coverlet-include '[Kiota.Builder]*' --coverlet-include '[kiota]*' --coverlet-exclude '[*.Tests]*'
      - name: Reject empty coverage and verify changed helper is exercised
        env:
          TEST_KIND: ${{ matrix.kind }}
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          import os, xml.etree.ElementTree as E
          reports=list(Path('TestResults').rglob('coverage.cobertura.*.xml'))
          assert len(reports)==3, reports
          helper=[]
          for report in reports:
              root=E.parse(report).getroot()
              assert int(root.get('lines-valid','0'))>0, report
              assert int(root.get('lines-covered','0'))>0, report
              print(report, root.attrib)
              for cls in root.findall('.//class'):
                  if cls.get('name')=='Kiota.Builder.Writers.Php.PhpConventionService':
                      helper.extend(m for m in cls.findall('methods/method') if m.get('name')=='GetDeprecationDescription')
          if os.environ['TEST_KIND']!='baseline':
              assert helper and any(float(m.get('line-rate','0'))==1 and float(m.get('branch-rate','0'))==1 for m in helper), [m.attrib for m in helper]
              print('Deprecation helper has 100% line and branch coverage in the writer suite.')
          PYTHON
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: explicit-coverage-${{ matrix.kind }}
          path: TestResults/**/coverage.cobertura.*.xml
  coverage-command-regression:
    if: ${{ inputs.coverageCommandOnly }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: baseline
            os: ubuntu-latest
            configuration: Debug
            sha: ${{ inputs.targetSha }}
          - kind: github
            os: ubuntu-latest
            configuration: Debug
            sha: ${{ inputs.contributionSha }}
          - kind: ado
            os: windows-latest
            configuration: Release
            sha: ${{ inputs.contributionSha }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: harness
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ matrix.sha }}
          path: contribution
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: contribution/global.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: stable
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Verify source and harness commits, restore, format and build
        working-directory: contribution
        shell: pwsh
        run: |
          if ((git rev-parse HEAD) -ne '${{ matrix.sha }}') { throw 'Wrong tested commit' }
          if ((git -C ../harness rev-parse HEAD) -ne '${{ github.sha }}') { throw 'Wrong harness commit' }
          git rev-parse HEAD
          dotnet restore kiota.slnx
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet format --verify-no-changes --no-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build kiota.slnx --no-restore --configuration ${{ matrix.configuration }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Execute actual pipeline test command and inspect coverage XML
        working-directory: contribution
        env:
          TEST_KIND: ${{ matrix.kind }}
          TEST_SHA: ${{ matrix.sha }}
        run: python ../harness/.github/kiota-preflight/coverage-command.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: coverage-command-${{ matrix.kind }}
          path: contribution/TestResults/**/coverage.cobertura.*.xml
'on':
  workflow_dispatch:
    inputs:
      coverageCommandOnly:
        description: Validate the actual pipeline coverage commands
        type: boolean
        default: false
      coverageOnly:
        description: Run supplemental non-empty coverage checks only
        type: boolean
        default: false
      mergeSha:
        description: Exact temporary merge commit for supplemental coverage
        type: string
        required: false
      contributionSha:
        description: Exact contribution commit
        required: true
        type: string
      targetSha:
        description: Current upstream main
        required: true
        type: string
      prNumber:
        description: Contribution PR
        required: true
        type: string
run-name: PR ${{ inputs.prNumber }} conflict validation - .NET
