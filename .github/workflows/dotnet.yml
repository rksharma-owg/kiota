name: Supplemental production coverage
on:
  workflow_dispatch:
    inputs:
      contributionSha:
        description: Exact contribution commit
        required: true
        type: string
      targetSha:
        description: Current upstream main ancestor
        required: true
        type: string
permissions:
  contents: read
jobs:
  production-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.contributionSha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify tested source and target
        env:
          TESTED_SHA: ${{ inputs.contributionSha }}
          TARGET_SHA: ${{ inputs.targetSha }}
        run: |
          test "$(git rev-parse HEAD)" = "$TESTED_SHA"
          git merge-base --is-ancestor "$TARGET_SHA" HEAD
          git rev-parse HEAD
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: stable
      - name: Restore and build unchanged source
        run: |
          dotnet restore kiota.slnx
          dotnet build kiota.slnx --no-restore
      - name: Run full suite with explicit production assembly coverage
        run: dotnet test kiota.slnx --no-build --verbosity normal --results-directory=./TestResults --coverlet --coverlet-output-format cobertura --coverlet-include '[Kiota.Builder]*' --coverlet-include '[kiota]*' --coverlet-exclude '[*.Tests]*'
      - name: Reject empty production coverage
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          import xml.etree.ElementTree as E
          reports = list(Path('TestResults').rglob('coverage.cobertura.*.xml'))
          assert len(reports) == 3, reports
          for report in reports:
              root = E.parse(report).getroot()
              assert int(root.get('lines-valid', '0')) > 0, report
              assert int(root.get('lines-covered', '0')) > 0, report
              classes = root.findall('.//class')
              assert classes, report
              print(report, root.attrib)
              print('Production classes:', len(classes))
          PYTHON
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: production-coverage
          path: TestResults/**/coverage.cobertura.*.xml
